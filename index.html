    "id":"gestionale","title":"Il gestionale «intelligente»","eyebrow":"PROGETTO 04 · SERVIZI SOCIALI","symbol":"📁","lead":"Un fornitore offre un modulo per «velocizzare la gestione delle domande di sostegno economico».",
    "scenario":"La brochure di SmartComune AI promette: «analizziamo le istanze e rendiamo più efficiente l'assegnazione dei contributi». Nessuna pagina della proposta chiarisce se l'IA smisti documenti, attribuisca priorità o valuti le persone.",
    "documents":[{"id":"a","name":"Brochure del fornitore","detail":"'Riduciamo il lavoro ripetitivo e ottimizziamo le decisioni'. Non vengono precisati gli output, gli indicatori o il ruolo dell'operatore umano."},{"id":"b","name":"Richiesta dell'ufficio","detail":"L'ente vuole ridurre i tempi di risposta per una prestazione pubblica essenziale, mantenendo procedure corrette e verificabili."}],
    "questions":[{"id":"q1","label":"Il sistema organizza i documenti o valuta i requisiti delle persone?","answer":"Il fornitore spiega che il modulo può produrre un indice di idoneità e suggerire quali domande respingere. La funzione NON è descritta nel capitolato originario."},{"id":"q2","label":"Quali dati vengono trattati e con quali garanzie?","answer":"Il contratto, le basi giuridiche e le misure di sicurezza non sono stati ancora valutati dagli uffici competenti."},{"id":"q3","label":"È già pronto un piano di verifica umana delle decisioni?","answer":"Non ancora. Il fornitore parla di 'revisione facoltativa', senza procedure e responsabilità formalizzate."}],
    "twist":{"title":"L'indice di idoneità","body":"Durante un incontro tecnico emerge che, oltre a smistare le domande, il programma calcola un punteggio individuale e propone gli esiti sulle richieste di prestazioni essenziali. Il responsabile del servizio afferma che il sistema 'fa soltanto una proposta'."},
    "expected":"pause","rationale":"Non si dovrebbe deliberare un acquisto o un avvio sulla base di una brochure generica. Il progetto comprende una possibile valutazione dell'accesso a prestazioni essenziali: occorre qualificare la funzione e analizzare gli obblighi, compresi quelli con applicazione differita, oltre alle garanzie già rilevanti oggi.",
    "actions":["Richiedere specifiche tecniche, finalità, criteri del punteggio e ruolo del personale umano.","Verificare la possibile classificazione ai sensi dell'Allegato III, punto 5(a), e le valutazioni di impatto applicabili.","Coinvolgere servizi sociali, RTD, DPO, ICT, ufficio legale e acquisti prima di decidere."],
    "norm":"AI Act, art. 6 e Allegato III, punto 5(a); valutazioni e norme già applicabili nel caso concreto.","debate":"Se il fornitore chiamasse il punteggio 'semplice suggerimento', cambierebbe qualcosa?","nuance":"La sospensione è un'attività istruttoria, non un divieto definitivo. Se il progetto risultasse incompatibile con la legge, andrebbe respinto o riprogettato."
  },
  {
    "id":"concorso","title":"Il concorso pubblico","eyebrow":"PROGETTO 05 · PERSONALE","symbol":"🧑‍💼","lead":"La direzione del personale vorrebbe usare un sistema che classifica i candidati.",
    "scenario":"Il software legge i curriculum, attribuisce un punteggio di compatibilità con il profilo ricercato e propone una graduatoria preliminare. La commissione di concorso mantiene formalmente la decisione conclusiva.",
    "documents":[{"id":"a","name":"Offerta tecnica","detail":"La piattaforma valuta esperienza, formazione e corrispondenza dei profili. Il fornitore non ha fornito analisi dei bias, documentazione sufficiente né procedure di controllo degli errori."},{"id":"b","name":"Nota della direzione","detail":"'Vogliamo adottarla nel prossimo concorso. Il personale esaminerà alla fine la classifica proposta, quindi non ci saranno problemi'."}],
    "questions":[{"id":"q1","label":"Il software archivia CV o valuta persone per la selezione?","answer":"Attribuisce punteggi e propone una graduatoria: influenza la valutazione dei candidati alla selezione."},{"id":"q2","label":"Cosa prevede il fornitore per spiegabilità, errori e sorveglianza?","answer":"Non ha consegnato documentazione sufficiente a verificare il sistema, i criteri di valutazione e le misure organizzative proposte."},{"id":"q3","label":"Il ruolo umano è effettivo o solo una firma finale?","answer":"La commissione riceve una graduatoria precompilata, ma non è definito come riesaminare i singoli punteggi e contestarne gli errori."}],
    "twist":{"title":"«C'è tempo fino al 2027!»","body":"Il fornitore dichiara: «Le regole specifiche dell'AI Act per questi sistemi ad alto rischio sono state rinviate al 2 dicembre 2027. Potete partire subito e occuparvi dei controlli dopo»."},
    "expected":"pause","rationale":"La selezione e valutazione di candidati rientrano negli impieghi indicati nell'Allegato III. Il differimento al 2 dicembre 2027 di obblighi specifici non equivale a un via libera privo di regole. Qui mancano verifiche e garanzie sufficienti; la scelta prudente è sospendere il progetto e svolgere l'istruttoria.",
    "actions":["Verificare finalità, classificazione, requisiti del sistema e documentazione del fornitore.","Definire una sorveglianza umana effettiva e controlli su accuratezza e disparità di trattamento.","Coinvolgere personale, RTD, DPO, ICT e ufficio legale prima di ogni adozione."],
    "norm":"AI Act, art. 6 e Allegato III, punto 4(a); applicazione specifici obblighi alto rischio: 2 dicembre 2027.","debate":"Se il funzionario firma una graduatoria prodotta dall'IA, è vera supervisione umana?","nuance":"Una futura approvazione non è esclusa in assoluto. La sospensione riguarda questa proposta, nelle condizioni documentali e organizzative illustrate."
  },
  {
    "id":"social","title":"Il punteggio del cittadino","eyebrow":"PROGETTO 06 · CARTA CRITICA","symbol":"🚫","lead":"Un sistema assegna un indice di affidabilità sociale ai residenti e lo usa per limitare servizi pubblici.",
    "scenario":"Una proposta prevede di valutare i cittadini in base ai commenti pubblicati sui social, ai comportamenti online e a caratteristiche personali stimate dall'IA. Chi riceve un punteggio basso subisce limitazioni nell'accesso a un servizio comunale senza relazione con quei comportamenti.",
    "documents":[{"id":"a","name":"Descrizione del punteggio","detail":"Il punteggio viene calcolato lungo un periodo di tempo aggregando comportamenti in contesti diversi e caratteristiche personali inferite."},{"id":"b","name":"Effetto concreto","detail":"I cittadini con punteggio basso vengono trattati sfavorevolmente nell'accesso a un servizio che non ha alcun collegamento con i comportamenti monitorati."}],
    "questions":[{"id":"q1","label":"Il comportamento valutato è pertinente al servizio limitato?","answer":"No. La limitazione riguarda un servizio totalmente scollegato dalle informazioni e dai comportamenti utilizzati per costruire il punteggio."},{"id":"q2","label":"Il punteggio produce conseguenze sfavorevoli per le persone?","answer":"Sì. A parità di condizioni per il servizio, un punteggio più basso determina un trattamento deteriore."},{"id":"q3","label":"Il risultato viene controllato da un funzionario?","answer":"Il progetto prevede una firma finale umana, ma l'indicatore e il trattamento sfavorevole rimangono quelli descritti."}],
    "twist":{"title":"«Ma decide un essere umano!»","body":"Il proponente aggiunge: «Nessuna esclusione sarà automatica. La decisione sarà firmata da un funzionario». Nella documentazione, però, il punteggio continua a penalizzare persone in un contesto estraneo ai dati usati per valutarle."},
    "expected":"reject","rationale":"Questo caso è costruito per rientrare nel divieto di social scoring: un giudizio sociale fondato su comportamenti o caratteristiche personali produce un trattamento sfavorevole in contesti non collegati. La firma finale di una persona non elimina automaticamente il divieto sulla pratica descritta.",
    "actions":["Respingerne l'adozione nella forma descritta, richiamando espressamente il divieto di social scoring.","Documentare la motivazione e segnalare la criticità alle funzioni competenti dell'ente.","Valutare eventuali sistemi alternativi che utilizzino solo criteri pertinenti, legittimi, necessari e proporzionati per il servizio."],
    "norm":"AI Act, art. 5(1)(c), divieto di determinate pratiche di social scoring (già applicabile).","debate":"Quale differenza c'è tra verificare requisiti pertinenti a un servizio e assegnare un voto alla persona?","nuance":"Non ogni punteggio su una persona è social scoring vietato. Qui il divieto dipende dalle caratteristiche specifiche: valutazione sociale e conseguenza sfavorevole in un contesto non collegato."
  }
]
</script>
<script>
(()=>{
'use strict';
const DOSSIERS=JSON.parse(document.getElementById('dossiers-json').textContent);
const INDEX=Object.fromEntries(DOSSIERS.map(d=>[d.id,d]));
const SHORT=['chatbot','gestionale','concorso','social'];
const FULL=['chatbot','spam','video','gestionale','concorso','social'];
const OUTCOMES={approve:{text:'APPROVA CON CONDIZIONI',mini:'Approva',icon:'✓'},pause:{text:'SOSPENDI PER ISTRUTTORIA',mini:'Sospendi',icon:'◷'},reject:{text:'RESPINGI LA PROPOSTA',mini:'Respingi',icon:'✕'}};
const app=document.getElementById('app');
const state={view:'home',mode:'short',team:'Commissione Borgonuovo',facilitator:false,ids:SHORT.slice(),idx:0,openDoc:null,inquiries:[],twist:false,decision:null,reason:'',records:[],seconds:25*60,tick:null,running:false,votes:{approve:0,pause:0,reject:0},feedback:false};
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function d(){return INDEX[state.ids[state.idx]]}
function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function stopTimer(){state.running=false;if(state.tick)clearInterval(state.tick);state.tick=null}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function countdown(){const clock=document.getElementById('clock');if(clock){clock.textContent=formatTime(state.seconds);clock.classList.toggle('warning',state.seconds<180)}}
function startTimer(){if(state.running)return;state.running=true;state.tick=setInterval(()=>{if(state.seconds>0){state.seconds--;countdown()}else{stopTimer();const label=document.getElementById('timerstatus');if(label)label.textContent='Tempo indicativo terminato: potete proseguire.'}},1000)}
function resetTimer(){stopTimer();state.seconds=state.mode==='short'?25*60:40*60;countdown()}
function begin(){state.ids=(state.mode==='short'?SHORT:FULL).slice();state.idx=0;state.records=[];state.seconds=state.mode==='short'?25*60:40*60;resetCase();state.view='case';resetTimer();render();scrollTop()}
function resetCase(){state.openDoc=null;state.inquiries=[];state.twist=false;state.decision=null;state.reason='';state.feedback=false;state.votes={approve:0,pause:0,reject:0}}
function changeView(view){state.view=view;render();scrollTop()}
function updateProgress(){const el=document.querySelector('.progress-fill');if(el)el.style.width=`${Math.round(100*state.records.length/state.ids.length)}%`}
function render(){app.innerHTML=state.view==='home'?homeMarkup():state.view==='case'?caseMarkup():resultMarkup();countdown();updateProgress()}
function homeMarkup(){return `<div class="wide">
<section class="hero"><div class="eyebrow">SIMULAZIONE FINALE · DECISIONE COLLEGIALE</div><h1>La Commissione IA<br>del Comune</h1><p>Sei alla scrivania di un Comune. Arrivano progetti di intelligenza artificiale: <strong>chiedi documenti, scopri nuovi fatti e delibera</strong>. Qui non vince chi indovina un colore. Conta la motivazione.</p><div class="kpis"><span>📁 Fascicoli amministrativi</span><span>🗣 Chiarimenti al fornitore</span><span>⚡ Imprevisti</span><span>📝 Verbale finale</span></div></section>
<div class="columns-home"><section class="card"><h2>Apri la seduta</h2><p class="muted">Ogni fascicolo presenta tre possibili esiti: <strong>approvare con condizioni, sospendere per istruttoria o respingere</strong>. Dopo la deliberazione, confrontate la vostra scelta con una guida motivata.</p>
<label class="field-label" for="team">Nome della squadra (facoltativo)</label><input class="textinput" id="team" maxlength="70" autocomplete="off" value="${esc(state.team)}" placeholder="Es. Commissione blu">
<div class="field-label">Scegli la durata</div><div class="modes"><label class="mode"><input type="radio" name="mode" value="short" ${state.mode==='short'?'checked':''}><strong>⚡ Seduta rapida</strong><small>4 fascicoli · circa 25 minuti · social scoring incluso</small></label><label class="mode"><input type="radio" name="mode" value="full" ${state.mode==='full'?'checked':''}><strong>📚 Seduta completa</strong><small>6 fascicoli · circa 40 minuti · più casi e approfondimento</small></label></div>
<label class="toggleline"><input id="facilitator" type="checkbox" ${state.facilitator?'checked':''}><span><strong>Modalità formatore</strong> (proiezione e conteggio manuale dei voti)</span></label>
<button type="button" class="primary full" data-action="start">Apri la Commissione →</button><p class="hint">Non è necessario registrarsi. Nessun dato viene inviato a server esterni.</p></section>
<aside class="card"><h2>Come funziona</h2><ul class="info-list"><li><span class="symbol">1</span><div><strong>Leggi il fascicolo</strong><br>Apri la proposta e i documenti disponibili.</div></li><li><span class="symbol">2</span><div><strong>Chiedi chiarimenti</strong><br>Interroga uffici e fornitori: scoprirai informazioni determinanti.</div></li><li><span class="symbol">3</span><div><strong>Affronta l'imprevisto</strong><br>Arriva un fatto nuovo: la valutazione potrebbe cambiare.</div></li><li><span class="symbol">4</span><div><strong>Delibera e verbalizza</strong><br>Approva, sospendi o respingi. Motiva a voce o per iscritto.</div></li></ul></aside></div>
<details class="details"><summary>Indicazioni per il formatore e fonti normative</summary><div class="detail-text"><p><strong>Formato consigliato:</strong> tre-quattro squadre, un solo schermo proiettato, 3–4 minuti per fascicolo e circa 5 minuti per il confronto conclusivo. La modalità formatore aggiunge un conteggio <em>manuale</em> dei voti comunicati dalle squadre: non raccoglie risposte in tempo reale.</p><p><strong>Obiettivo:</strong> distinguere progetto approvabile con garanzie, progetto da sospendere e pratica vietata. I casi sono simulazioni e le deliberazioni consigliate non sostituiscono un'istruttoria giuridico-tecnica reale.</p><p><strong>Fonti UE:</strong> <a href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-5" target="_blank" rel="noopener noreferrer">articolo 5</a>, <a href="https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6" target="_blank" rel="noopener noreferrer">articolo 6</a>, <a href="https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3" target="_blank" rel="noopener noreferrer">Allegato III</a>, <a href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-50" target="_blank" rel="noopener noreferrer">articolo 50</a>, <a href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/timeline/calendario-lattuazione-della-normativa-dellue-sullia" target="_blank" rel="noopener noreferrer">calendario applicativo</a>.</p></div></details></div>`}
function steps(){return `<div class="timeline"><span class="step ${state.inquiries.length||state.openDoc?'done':'current'}">1 · Fascicolo</span><span class="step ${state.twist?'done':state.inquiries.length?'current':''}">2 · Chiarimenti</span><span class="step ${state.feedback?'done':state.twist?'current':''}">3 · Delibera</span><span class="step ${state.feedback?'current':''}">4 · Esito</span></div>`}
function caseMarkup(){const x=d();const pos=state.idx+1;const answered=state.inquiries.length>0;return `<div class="wide game-controls"><div class="case-header"><div><div class="eyebrow">SEDUTA IN CORSO</div><h2 class="sectiontitle">${esc(state.team)}</h2></div><div class="subtle">Fascicolo ${pos} di ${state.ids.length} · ${state.records.length} deliberazioni concluse</div></div><div class="progress-track"><div class="progress-fill" style="width:${100*state.records.length/state.ids.length}%"></div></div></div>
<div class="wide game-grid"><section class="workspace"><div class="dossier"><div class="dossier-head"><div class="number">${esc(x.eyebrow)}</div><h1><span aria-hidden="true">${esc(x.symbol)}</span> ${esc(x.title)}</h1><p>${esc(x.lead)}</p></div><div class="dossier-inner">${steps()}
<h3 class="heading-label">📋 Proposta all'ordine del giorno</h3><div class="brief">${esc(x.scenario)}</div>
<h3 class="heading-label">📎 Documenti disponibili</h3><div class="document-list">${x.documents.map((f,i)=>`<button class="document-button ${state.openDoc===f.id?'active':''}" type="button" data-action="doc" data-id="${esc(f.id)}"><span class="doc-icon">${i?'📄':'🗂'}</span><span><span class="doc-title">${esc(f.name)}</span><span class="doc-sub">Apri il documento</span></span></button>`).join('')}</div>${x.documents.find(f=>f.id===state.openDoc)?`<div class="doc-content"><strong>${esc(x.documents.find(f=>f.id===state.openDoc).name)}</strong>\n${esc(x.documents.find(f=>f.id===state.openDoc).detail)}</div>`:''}
<h3 class="heading-label">🔎 Richiedi chiarimenti (almeno uno)</h3><p class="muted small" style="margin-top:-5px">Scegli le domande utili: il fornitore o l'ufficio rispondono con informazioni aggiuntive.</p><div class="qgrid">${x.questions.map(q=>`<div><button type="button" class="qbutton ${state.inquiries.includes(q.id)?'selected':''}" data-action="ask" data-id="${esc(q.id)}" ${state.feedback?'disabled':''}><span>${esc(q.label)}</span><span aria-hidden="true">${state.inquiries.includes(q.id)?'✓':'→'}</span></button>${state.inquiries.includes(q.id)?`<div class="answer"><strong>Risposta acquisita:</strong> ${esc(q.answer)}</div>`:''}</div>`).join('')}</div>
${answered&&!state.twist?`<h3 class="heading-label">⚡ Arriva un nuovo elemento</h3><button class="twist-button" type="button" data-action="twist">Apri la comunicazione urgente della seduta →</button>`:''}
${state.twist?`<div class="twist"><div class="twist-header">⚡ ${esc(x.twist.title)}</div><div class="twist-content">${esc(x.twist.body)}</div></div>`:''}
${!state.twist?`<div class="gate">Esaminate almeno un chiarimento, poi aprite la comunicazione urgente. Solo allora potrete deliberare.</div>`:!state.feedback?deliberationMarkup():feedbackMarkup(x)}
</div></div></section><aside class="right-panel">${sidebarMarkup(x)}</aside></div>`}
function deliberationMarkup(){return `<h3 class="heading-label">⚖ La Commissione delibera</h3><p class="muted small">Non scegliete un livello di rischio: decidete cosa fare <strong>oggi</strong> con questa proposta, alla luce di ciò che sapete.</p><div class="decision-row">${Object.entries(OUTCOMES).map(([key,val])=>`<button type="button" class="decision ${state.decision===key?'chosen':''}" data-action="decision" data-choice="${key}" aria-pressed="${state.decision===key}"><span class="decision-icon">${val.icon}</span><strong>${esc(val.mini.toUpperCase())}</strong><small>${key==='approve'?'con prescrizioni':key==='pause'?'prima di decidere':'nella forma proposta'}</small></button>`).join('')}</div><label class="field-label" for="reason">Motivazione della Commissione (anche una sola frase, facoltativa)</label><textarea id="reason" class="reason" maxlength="1200" placeholder="Es.: Chiediamo prima le specifiche e le garanzie...">${esc(state.reason)}</textarea><div class="actions"><button type="button" class="primary" data-action="submit" ${state.decision?'':'disabled'}>Verbalizza e confronta la decisione →</button></div><p class="hint">La motivazione può essere anche discussa a voce: non viene corretta automaticamente da un'IA.</p>`}
function feedbackMarkup(x){const own=state.decision;const matching=own===x.expected;const exp=OUTCOMES[x.expected];return `<div class="feedback" id="feedback"><div class="feedback-title">📜 Confronto con la guida per il formatore</div><div class="feedback-inner"><div class="statusline"><span class="outcome-pill ${x.expected}">Orientamento consigliato: ${esc(exp.text)}</span></div><p><strong>La vostra Commissione:</strong> ${esc(OUTCOMES[own].text)}.</p><p><strong>${matching?'Valutazione coerente con il caso':'Una scelta diversa può richiedere una motivazione più approfondita'}.</strong> ${esc(x.rationale)}</p><h3 class="heading-label">Azioni da mettere a verbale</h3><ul class="goodlist">${x.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><p class="reference"><strong>Riferimento:</strong> ${esc(x.norm)}</p><p><strong>Precisazione:</strong> ${esc(x.nuance)}</p><div class="actions"><button class="primary" type="button" data-action="next">${state.idx===state.ids.length-1?'Chiudi la seduta e apri il verbale →':'Passa al fascicolo successivo →'}</button></div></div></div>`}
function sidebarMarkup(x){return `<div class="aside-block"><h3 class="aside-title">⏱ Tempo della seduta</h3><div class="clock" id="clock">${formatTime(state.seconds)}</div><div class="time-buttons"><button class="tiny-btn" type="button" data-action="timer">${state.running?'⏸ Pausa':'▶ Avvia'}</button><button class="tiny-btn" type="button" data-action="timerreset">↺ Reimposta</button></div><p id="timerstatus">Tempo indicativo, non un limite rigido.</p></div>
<div class="aside-block"><h3 class="aside-title">🎯 Domanda del formatore</h3><div class="debate">${esc(x.debate)}</div><div class="divider"></div><p><strong>Tre possibili esiti</strong><br>✓ Approva con condizioni<br>◷ Sospendi per istruttoria<br>✕ Respingi nella forma proposta</p></div>
${state.facilitator?`<div class="aside-block"><h3 class="aside-title">🗳 Voti delle squadre</h3><p>Conteggio manuale da usare sullo schermo proiettato. Non riceve voti da altri dispositivi.</p>${Object.entries(OUTCOMES).map(([key,val])=>`<div class="vote-row"><span>${esc(val.mini)}</span><strong>${state.votes[key]}</strong><span class="vote-buttons"><button type="button" aria-label="Aggiungi voto ${esc(val.mini)}" data-action="vote" data-choice="${key}" data-delta="1">+</button><button type="button" aria-label="Rimuovi voto ${esc(val.mini)}" data-action="vote" data-choice="${key}" data-delta="-1">−</button></span></div>`).join('')}<button class="ghost" data-action="votereset" type="button">Azzera voti</button></div>`:''}`}
function resultMarkup(){const counts={approve:0,pause:0,reject:0};state.records.forEach(r=>counts[r.outcome]++);return `<div class="wide"><div class="result-hero"><div class="eyebrow">SEDUTA CONCLUSA</div><h1>Il verbale della Commissione</h1><p>${esc(state.team)} ha esaminato ${state.records.length} proposte. L'obiettivo non era collezionare risposte giuste, ma saper chiedere chiarimenti, distinguere le responsabilità e motivare le scelte.</p><div class="result-count"><span>✓ ${counts.approve} approvazioni condizionate</span><span>◷ ${counts.pause} sospensioni</span><span>✕ ${counts.reject} respinte</span></div></div>
${state.records.map((r,i)=>{const x=INDEX[r.id];return `<section class="result-card"><div class="result-head"><h3>${i+1}. ${esc(x.title)}</h3><span class="outcome-pill ${r.outcome}">${esc(OUTCOMES[r.outcome].text)}</span></div><p><strong>Orientamento didattico:</strong> ${esc(OUTCOMES[x.expected].text)}</p><p><strong>Motivazione della squadra:</strong> ${r.reason?esc(r.reason):'<em>Discussa a voce / non inserita.</em>'}</p><div class="notesbox"><strong>Perché:</strong> ${esc(x.rationale)}</div></section>`}).join('')}
<div class="card"><h2>Tre domande che restano dopo il laboratorio</h2><ul class="goodlist"><li>Che cosa fa concretamente il sistema e su chi produce effetti?</li><li>Che cosa non sappiamo ancora e chi deve verificarlo?</li><li>La proposta è approvabile con condizioni, da approfondire o da respingere?</li></ul><p class="muted small">Questo verbale è una simulazione didattica. Le classificazioni e le decisioni su sistemi reali richiedono un'istruttoria effettiva, anche rispetto alle scadenze di applicazione delle singole norme.</p></div>
<div class="endactions"><button type="button" class="primary" data-action="download">↓ Scarica verbale .txt</button><button type="button" class="secondary" data-action="print">⎙ Stampa / Salva PDF</button><button type="button" class="secondary" data-action="restart">↻ Nuova seduta</button></div></div>`}
function buildReport(){const date=new Date().toLocaleString('it-IT');let lines=['COMMISSIONE IA DEL COMUNE — VERBALE DIDATTICO',`Squadra: ${state.team}`,`Seduta conclusa: ${date}`,`Percorso: ${state.mode==='short'?'rapido':'completo'}`,'','Nota: esercitazione formativa. Le deliberazioni non hanno efficacia amministrativa.',''];state.records.forEach((r,i)=>{const x=INDEX[r.id];lines.push(`${i+1}. ${x.title.toUpperCase()}`,`Proposta: ${x.scenario}`,`Deliberazione della squadra: ${OUTCOMES[r.outcome].text}`,`Motivazione: ${r.reason||'Discussa oralmente, non trascritta.'}`,`Chiarimenti richiesti: ${r.inquiries.map(id=>x.questions.find(q=>q.id===id)?.label).filter(Boolean).join(' | ')||'Nessuno'}`,`Orientamento didattico: ${OUTCOMES[x.expected].text}`,`Spiegazione: ${x.rationale}`,`Riferimenti: ${x.norm}`,'Misure e verifiche: ',...x.actions.map(a=>`- ${a}`),'','------------------------------','')});lines.push('FONTI: Regolamento (UE) 2024/1689 e testo consolidato UE; articoli 5, 6 e 50; Allegato III.','Tutte le valutazioni su progetti reali richiedono ulteriori verifiche giuridiche e organizzative.');return lines.join('\n')}
function downloadReport(){const blob=new Blob(['\ufeff'+buildReport()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='verbale_commissione_IA_comune.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function submit(){if(!state.decision||state.feedback)return;state.feedback=true;state.records.push({id:d().id,outcome:state.decision,reason:state.reason.trim(),inquiries:[...state.inquiries]});render();const el=document.getElementById('feedback');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function next(){if(!state.feedback)return;if(state.idx===state.ids.length-1){stopTimer();changeView('results')}else{state.idx++;resetCase();render();scrollTop()}}
function handleAction(btn){const action=btn.dataset.action;if(action==='start')return begin();if(action==='doc'){state.openDoc=state.openDoc===btn.dataset.id?null:btn.dataset.id;render();return}if(action==='ask'){if(state.feedback)return;if(!state.inquiries.includes(btn.dataset.id)){state.inquiries.push(btn.dataset.id);render()}return}if(action==='twist'){if(state.inquiries.length){state.twist=true;render()}return}if(action==='decision'){state.decision=btn.dataset.choice;render();return}if(action==='submit')return submit();if(action==='next')return next();if(action==='restart'){stopTimer();resetCase();changeView('home');return}if(action==='download')return downloadReport();if(action==='print')return window.print();if(action==='timer'){if(state.running)stopTimer();else startTimer();render();return}if(action==='timerreset'){resetTimer();render();return}if(action==='vote'){let k=btn.dataset.choice;state.votes[k]=Math.max(0,state.votes[k]+Number(btn.dataset.delta));render();return}if(action==='votereset'){state.votes={approve:0,pause:0,reject:0};render();return}}
app.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(btn)handleAction(btn)});
app.addEventListener('change',e=>{if(e.target.name==='mode')state.mode=e.target.value;if(e.target.id==='facilitator')state.facilitator=e.target.checked});
app.addEventListener('input',e=>{if(e.target.id==='team')state.team=e.target.value.slice(0,70);if(e.target.id==='reason')state.reason=e.target.value.slice(0,1200)});
document.getElementById('homeTop').addEventListener('click',()=>{if(state.view==='case'&&state.records.length&&!window.confirm('Tornare all’inizio? La seduta in corso andrà persa.'))return;stopTimer();resetCase();changeView('home')});
window.addEventListener('beforeunload',e=>{if(state.view==='case'&&state.records.length>0){e.preventDefault();e.returnValue=''}});
render();
})();
</script>
</body>
</html>
